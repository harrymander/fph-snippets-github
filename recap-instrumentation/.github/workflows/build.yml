name: Build
on:
  push:
    branches: ["*"]
    tags: ["v**"]
    paths:
      - "sw/**"
      - ".github/**"
      - "!**/*.md"
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
  build:
    needs: [pre-commit]
    runs-on: ubuntu-26.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            make
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Test
        env:
          UTEST_COLOR: "yes"
        run: |
          ctest --build-and-test sw/test sw/test/build \
          --build-generator 'Unix Makefiles' \
          --test-command ctest --output-on-failure
      - name: Build binary
        run: |
          VERSION="$(make -sC sw print-version)"
          export VERSION
          export TARGET=recap-instrumentation-${VERSION}.elf
          export BUILD_DIR=build
          make -sC sw print-config
          make -C sw -j
          make -C sw print-build-id
          echo "EXEC_PATH=sw/${BUILD_DIR}/${TARGET}" >> "$GITHUB_ENV"
          # shellcheck disable=SC2193
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "ARTIFACT_REF=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: recap-instrumentation-${{ env.ARTIFACT_REF }}
          path: ${{ env.EXEC_PATH }}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: recap-instrumentation-${{ github.ref_name }}
          path: recap-instrumentation-${{ github.ref_name }}
      - name: Archive artifacts
        run: zip -r recap-instrumentation-${{ github.ref_name }}.zip recap-instrumentation-${{ github.ref_name }}
      - name: Create release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: recap-instrumentation-${{ github.ref_name }}.zip
